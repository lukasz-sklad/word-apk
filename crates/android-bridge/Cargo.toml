[package]
name = "wordcraft-android-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft Android bridge: JNI bindings for Kotlin and Jetpack Compose"

[lints.rust]
unsafe_code = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-geom = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-formats = { workspace = true }
jni = { version = "0.21", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
